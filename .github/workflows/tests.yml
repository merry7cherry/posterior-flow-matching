name: CPU tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      OMP_NUM_THREADS: "2"
      MKL_NUM_THREADS: "2"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install CPU PyTorch and package
        run: |
          python -m pip install torch==2.11.0 torchvision==0.26.0 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -e '.[dev]'
      - name: Check public entrypoints
        run: |
          pfm-train --help
          pfm-sample --help
          pfm-evaluate --help
          pfm-prepare-data --help
      - name: Check method, model, and numerical contracts
        run: >-
          python -m pytest -q
          tests/test_config.py tests/test_models.py tests/test_edm_backbone.py
          tests/test_jit_backbone.py tests/test_jit_config.py
          tests/test_objectives.py tests/test_diagonal_gaussian.py
          tests/test_training_step.py tests/test_sampling_numerics.py
          tests/test_sampling_shapes.py tests/test_sde_sampling.py
          tests/test_posterior_math_core.py
      - name: Check portable CLI, resume, and standalone checkpoints
        run: >-
          python -m pytest -q
          tests/test_portable_cli.py tests/test_cli_contract.py
          tests/test_classifier.py tests/test_training_resume.py
          tests/test_standalone_checkpoint.py
