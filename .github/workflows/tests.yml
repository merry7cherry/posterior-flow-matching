name: CPU tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  OMP_NUM_THREADS: '2'
  MKL_NUM_THREADS: '2'
  OPENBLAS_NUM_THREADS: '2'
  MPLBACKEND: Agg

jobs:
  images:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: images
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install torch==2.11.0 torchvision==0.26.0 --index-url https://download.pytorch.org/whl/cpu
      - run: python -m pip install '.[dev]' build
      - run: python -m pytest -q
      - run: python -m build
      - name: Installed entrypoints
        run: |
          python -m pip install --force-reinstall --no-deps dist/*.whl
          cd "$RUNNER_TEMP"
          pfm-images-train --help
          pfm-images-sample --help
          pfm-images-evaluate --help
          pfm-images-prepare --help

  pointcloud:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: pointcloud
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install torch==2.8.0 --index-url https://download.pytorch.org/whl/cpu
      - run: python -m pip install '.[test]' build
      - run: python -m pytest -q
      - run: python -m build
      - name: Installed entrypoints
        run: |
          python -m pip install --force-reinstall --no-deps dist/*.whl
          cd "$RUNNER_TEMP"
          pfm-pointcloud-train --help
          pfm-pointcloud-sample --help
          pfm-pointcloud-evaluate --help
          pfm-pointcloud-diagnostics --help

  molecules:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: molecules
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --upgrade pip setuptools wheel
      - run: python -m pip install torch==2.5.1 --index-url https://download.pytorch.org/whl/cpu
      - run: python -m pip install torch-cluster==1.6.3 -f https://data.pyg.org/whl/torch-2.5.1+cpu.html
      - run: python -m pip install '.[test,visualize]'
      - run: python -m pytest -q
      - run: python -m build
      - name: Installed entrypoints
        run: |
          python -m pip install --force-reinstall --no-deps dist/*.whl
          cd "$RUNNER_TEMP"
          pfm-molecules-example --output-dir molecule-example
          pfm-molecules-train --help
          pfm-molecules-sample --help
          pfm-molecules-evaluate --help
          pfm-molecules-diagnostics --help
          pfm-molecules-chirality --help
          pfm-molecules-visualize --help
          pfm-molecules-prepare --help

  pusht:
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: pusht
    env:
      SDL_VIDEODRIVER: dummy
      SDL_AUDIODRIVER: dummy
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: '3.10'
      - run: uv venv
      - run: uv pip install torch==2.7.1 torchvision==0.22.1 --index-url https://download.pytorch.org/whl/cpu
      - run: uv pip install --excludes requirements-exclude.txt '.[test]'
      - run: .venv/bin/python -m pytest -q
      - run: uv build --python .venv/bin/python
      - name: Installed entrypoints
        run: |
          uv pip install --no-deps --reinstall dist/*.whl
          cd "$RUNNER_TEMP"
          "$GITHUB_WORKSPACE/pusht/.venv/bin/pfm-pusht-train" --help
          "$GITHUB_WORKSPACE/pusht/.venv/bin/pfm-pusht-evaluate" --help
          "$GITHUB_WORKSPACE/pusht/.venv/bin/pfm-pusht-diagnose" --help
