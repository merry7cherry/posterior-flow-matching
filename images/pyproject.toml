[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "posterior-flow-matching-images"
version = "0.2.0"
description = "Posterior Flow Matching for images"
readme = "README.md"
license = "MIT AND CC-BY-NC-SA-4.0"
license-files = ["LICENSE", "THIRD_PARTY_NOTICES.md", "third_party/licenses/*"]
requires-python = ">=3.13,<3.14"
dependencies = ["torch==2.11.0", "torchvision==0.26.0", "numpy==2.4.6", "Pillow==12.2.0", "PyYAML==6.0.3"]

[project.optional-dependencies]
dev = ["pytest==9.1.1"]
eval = ["torch-fidelity @ git+https://github.com/LTH14/torch-fidelity.git@bfe72b995473e4fee9351705d7b005f17442a4ca"]

[project.scripts]
pfm-images-train = "pfm.train:main"
pfm-images-sample = "pfm.sample:main"
pfm-images-evaluate = "pfm.evaluate:main"
pfm-images-prepare = "pfm.prepare:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
