seed: 42
dataset: cifar10
architecture: edm_ddpmpp
edm_compile: true
num_classes: 10
image_channels: 3
image_size: 32
time_embed_scale: 1000.0
time_embed_max_period: 10000.0
edm_model_channels: 128
edm_channel_mult: [1, 2, 2, 2]
edm_channel_mult_emb: 4
edm_num_blocks: 4
edm_attn_resolutions: [16]
edm_dropout: 0.10
edm_label_dropout: 0.0
edm_norm_groups: 32
mixed_precision: bf16
allow_tf32: false
cudnn_benchmark: true
drop_last: true
batch_size: 256
num_workers: 4
limit_train_batches: null
epochs: 600
lr: 0.0002
base_lr: null
lr_reference_batch_size: 256
scale_lr_by_effective_batch: false
weight_decay: 0.0001
adamw_beta1: 0.9
adamw_beta2: 0.999
warmup_epochs: 0
lr_schedule: constant
max_grad_norm: 1.0
ema_decay: 0.999
eps_t: 0.001
time_sampling: uniform
logit_normal_p_mean: -0.8
logit_normal_p_std: 0.8
logvar_min: -2.0
logvar_max: 1.0
logvar_init: 0.0
self_conditioning_mode: none
noise_scale: 1.0
checkpoint_every_epochs: 50
