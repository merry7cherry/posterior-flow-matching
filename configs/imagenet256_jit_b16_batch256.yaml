seed: 42
dataset: imagenet
architecture: jit_transformer
num_classes: 1000
image_channels: 3
image_size: 256
jit_model: JiT-B/16
jit_attn_dropout: 0.0
jit_proj_dropout: 0.0
jit_compile: true
jit_attention_implementation: upstream_fp32_qk
mixed_precision: bf16
allow_tf32: false
cudnn_benchmark: true
drop_last: true
batch_size: 256
num_workers: 12
limit_train_batches: null
epochs: 600
lr:
base_lr: 0.00005
lr_reference_batch_size: 256
scale_lr_by_effective_batch: true
weight_decay: 0.0
adamw_beta1: 0.9
adamw_beta2: 0.95
warmup_epochs: 5
lr_schedule: constant
max_grad_norm: 5.0
ema_decay: 0.9999
eps_t: 0.001
time_sampling: logit_normal
logit_normal_p_mean: -0.8
logit_normal_p_std: 0.8
logvar_min: -1.0
logvar_max: 1.0
logvar_init: 0.0
self_conditioning_mode: none
noise_scale: 1.0
checkpoint_every_epochs: 10
