seed: 42
dataset: mnist
architecture: conditional_unet
num_classes: 10
image_channels: 1
image_size: 28
time_embed_dim: 128
time_embed_scale: 1000.0
time_embed_max_period: 10000.0
time_proj_dim: 128
class_embed_dim: 128
class_proj_dim: 128
unet_base_channels: 32
unet_channel_mult: [1, 2, 4]
unet_num_res_blocks: 2
unet_attention_resolutions: []
unet_num_heads: 1
