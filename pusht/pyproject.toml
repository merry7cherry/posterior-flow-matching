[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "posterior-flow-matching-pusht"
version = "0.1.0"
description = "Posterior Flow Matching for native image-conditioned PushT"
readme = "README.md"
requires-python = ">=3.10,<3.11"
license = "MIT AND Apache-2.0"
license-files = ["LICENSE", "THIRD_PARTY_NOTICES.md", "licenses/*.txt"]
dependencies = [
  "numpy==1.26.4", "scipy==1.15.3", "numba==0.61.2",
  "torch==2.7.1", "torchvision==0.22.1", "robomimic==0.2.0",
  "gym==0.23.1", "pymunk==6.2.1", "pygame==2.6.1", "shapely==1.8.5.post1",
  "opencv-python-headless==4.11.0.86", "scikit-image==0.24.0",
  "zarr==2.18.3", "numcodecs==0.13.1", "hydra-core==1.3.2", "einops==0.8.1",
  "dill==0.3.8", "h5py==3.13.0", "av==12.3.0", "threadpoolctl==3.6.0", "tqdm>=4.66", "six>=1.16"
]
[project.optional-dependencies]
test = ["pytest==8.4.0"]
[project.scripts]
pfm-pusht-train = "diffusion_policy.cli:train"
pfm-pusht-evaluate = "diffusion_policy.cli:evaluate"
pfm-pusht-diagnose = "diffusion_policy.cli:diagnose"
[project.urls]
Homepage = "https://merry7cherry.github.io/posterior-flow-matching/"
Repository = "https://github.com/merry7cherry/posterior-flow-matching/tree/main/pusht"

[tool.setuptools.packages.find]
include = ["diffusion_policy*"]
[tool.setuptools.package-data]
diffusion_policy = ["config/*.yaml"]
[tool.pytest.ini_options]
testpaths = ["tests"]
