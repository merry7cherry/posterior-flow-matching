_target_: diffusion_policy.workspace.train_pfm_workspace.PFMWorkspace
dataloader:
  batch_size: 64
  num_workers: 0
  persistent_workers: false
  pin_memory: false
  shuffle: true
ema:
  _target_: diffusion_policy.model.diffusion.ema_model.EMAModel
  inv_gamma: 1.0
  max_value: 0.9999
  min_value: 0.0
  power: 0.75
  update_after_step: 0
optimizer:
  _target_: torch.optim.AdamW
  betas:
  - 0.95
  - 0.999
  eps: 1.0e-08
  lr: 0.0001
  weight_decay: 1.0e-06
policy:
  _target_: diffusion_policy.policy.pfm_image_policy.PFMImagePolicy
  cond_predict_scale: true
  crop_shape:
  - 84
  - 84
  diffusion_step_embed_dim: 128
  down_dims:
  - 512
  - 1024
  - 2048
  eval_fixed_crop: true
  horizon: 16
  kernel_size: 5
  n_action_steps: 8
  n_groups: 8
  n_obs_steps: 2
  logvar_min: -3.0
  logvar_max: 3.0
  logvar_init: 0.0
  eps_t: 0.001
  noise_scale: 1.0
  time_embed_scale: 1000.0
  mixed_precision: fp32
  sampling:
    solver: ode
    steps: 20
    terminal_time: 0.99
    diffusion_scale: 0.0
    derivative_probes: 4
    exact_derivatives: false
    seed: 321
  obs_encoder_group_norm: true
  shape_meta:
    action:
      shape:
      - 2
    obs:
      agent_pos:
        shape:
        - 2
        type: low_dim
      image:
        shape:
        - 3
        - 96
        - 96
        type: rgb
task:
  dataset:
    _target_: diffusion_policy.dataset.pusht_image_dataset.PushTImageDataset
    horizon: 16
    max_train_episodes: 90
    pad_after: 7
    pad_before: 1
    seed: 42
    val_ratio: 0.02
    zarr_path: data/pusht/pusht_cchi_v7_replay.zarr
  env_runner:
    _target_: diffusion_policy.env_runner.pusht_image_runner.PushTImageRunner
    fps: 10
    max_steps: 300
    n_action_steps: 8
    n_envs: 1
    n_obs_steps: 2
    n_test: 50
    n_test_vis: 4
    n_train: 6
    n_train_vis: 2
    test_start_seed: 100000
    train_start_seed: 0
training:
  checkpoint_every: 50
  device: cpu
  max_grad_norm: 1.0
  lr_scheduler: cosine
  lr_warmup_steps: 500
  max_train_steps: null
  max_val_steps: null
  num_epochs: 3050
  resume: null
  rollout_every: 50
  sample_every: 5
  seed: 42
  tqdm_interval_sec: 1.0
  use_ema: true
  val_every: 1
val_dataloader:
  batch_size: 64
  num_workers: 0
  persistent_workers: false
  pin_memory: false
  shuffle: false
